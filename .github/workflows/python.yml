name: tests

on:
  push:
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]
  release:
    types: [published]

defaults:
  run:
    working-directory: python

jobs:
  test-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies only
        run: pip install -e .
      - name: Exercise public functions without SciPy
        run: |
          python - <<'PY'
          import importlib.util
          import elliptic

          assert importlib.util.find_spec("scipy") is None
          elliptic.theta(1, 0.2, 0.5)
          elliptic.theta_prime(1, 0.2, 0.5)
          elliptic.jacobiThetaEta(0.2, 0.5)
          elliptic.nomeq(0.5)
          elliptic.inversenomeq(0.04)
          elliptic.inverselliptic2(0.5, 0.5)
          elliptic.elliptic12i(0.7 + 0.2j, 0.5)
          elliptic.arclength_ellipse([2.0, 3.0], [3.0, 2.0])
          PY

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with torch
        run: pip install -e ".[dev,torch]"
      - name: Run tests (torch backend)
        run: python -m pytest tests/ -q

  test-jax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with jax
        run: pip install -e ".[dev,jax]"
      - name: Run tests (jax backend)
        run: python -m pytest tests/ -q

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-standalone, test, test-torch, test-jax]
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publisher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
